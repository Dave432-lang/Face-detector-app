name: Build iOS App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    name: Build Unsigned iOS IPA
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app || sudo xcode-select -s /Applications/Xcode_15.4.app || true
          xcodebuild -version

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build web application
        working-directory: frontend
        env:
          VITE_API_URL: https://face-detector-app-o7u4.onrender.com
        run: npm run build

      - name: Copy Web Assets to iOS
        working-directory: frontend
        run: npx cap copy ios

      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -project frontend/ios/App/App.xcodeproj \
            -scheme App \
            -resolvePackageDependencies

      - name: Build iOS App with Xcode (Unsigned)
        run: |
          xcodebuild -project frontend/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Package .ipa
        run: |
          mkdir -p build/Payload
          cp -r build/Build/Products/Release-iphoneos/App.app build/Payload/
          cd build
          zip -r FaceDetectorApp-unsigned.ipa Payload

      - name: Upload iOS .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FaceDetectorApp-iOS-unsigned
          path: build/FaceDetectorApp-unsigned.ipa
          retention-days: 14
