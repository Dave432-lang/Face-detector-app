services:
  - type: web
    name: face-detector-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ULTRALYTICS_ENDPOINT
        value: https://platform.ultralytics.com/api/deployments/david-dagbanja/exp-paris/predict
      - key: ULTRALYTICS_API_KEY
        sync: false # Set securely in Render dashboard
